[project]
name = "d2-staruml"
version = "0.1.0"
description = "Render plain d2 class diagrams in StarUML style"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compile = "src.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
